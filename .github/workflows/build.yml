name: Build and release

# Every push to main builds a new version and publishes it as a GitHub Release.
# Installed copies of TypeWheel check those releases and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      # Version = major.minor from package.json + this run's number, e.g. 1.1.14.
      # Bump major/minor in package.json yourself when you want; the patch counts up on its own.
      - name: Set version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$BASE.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "Building v$BASE.${{ github.run_number }}"

      - name: Build and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TypeWheel-windows
          path: dist/*.exe
          if-no-files-found: error
